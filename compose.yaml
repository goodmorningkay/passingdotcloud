name: passing-cloud

services:
  web:
    image: passing-cloud-web:${PASSING_RELEASE:-local}
    build:
      context: .
      target: web
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 128
    ulimits:
      core: 0
    environment:
      PASSING_PUBLIC_ORIGIN: ${PASSING_PUBLIC_ORIGIN:?Set PASSING_PUBLIC_ORIGIN to your public HTTPS origin}
      PASSING_FEEDBACK_EMAIL: ${PASSING_FEEDBACK_EMAIL:-}
      PASSING_BITCOIN_DONATION_ADDRESS: ${PASSING_BITCOIN_DONATION_ADDRESS:-}
    logging:
      driver: none
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      backend:
        ipv4_address: 172.30.48.4
    depends_on:
      api:
        condition: service_healthy

  api:
    image: passing-cloud-api:${PASSING_RELEASE:-local}
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 128
    environment:
      NODE_ENV: production
      PASSING_API_HOST: 0.0.0.0
      PASSING_API_PORT: 4000
      PASSING_DATA_DIR: /app/data
      PASSING_PUBLIC_ORIGIN: ${PASSING_PUBLIC_ORIGIN:?Set PASSING_PUBLIC_ORIGIN to your public HTTPS origin}
      PASSING_TRUST_PROXY: 172.30.48.2
      PASSING_STORAGE_BYTES: ${PASSING_STORAGE_BYTES:-10000000000}
      PASSING_DISK_HEADROOM_BYTES: ${PASSING_DISK_HEADROOM_BYTES:-2000000000}
      PASSING_MAX_TRANSFERS: ${PASSING_MAX_TRANSFERS:-10000}
      PASSING_DOWNLOAD_ATTEMPTS: ${PASSING_DOWNLOAD_ATTEMPTS:-10}
      PASSING_MAX_UPLOADS: ${PASSING_MAX_UPLOADS:-8}
      PASSING_MAX_DOWNLOADS: ${PASSING_MAX_DOWNLOADS:-24}
      PASSING_MAX_STREAMS: ${PASSING_MAX_STREAMS:-32}
      PASSING_GLOBAL_BYTES_PER_HOUR: ${PASSING_GLOBAL_BYTES_PER_HOUR:-100000000000}
      PASSING_STREAM_TIMEOUT_MS: ${PASSING_STREAM_TIMEOUT_MS:-300000}
      PASSING_REPORTS_PER_HOUR: ${PASSING_REPORTS_PER_HOUR:-3}
      PASSING_GLOBAL_REPORT_ATTEMPTS_PER_MINUTE: ${PASSING_GLOBAL_REPORT_ATTEMPTS_PER_MINUTE:-100}
      PASSING_GLOBAL_REPORTS_PER_HOUR: ${PASSING_GLOBAL_REPORTS_PER_HOUR:-100}
      PASSING_ADMIN_KEY: ${PASSING_ADMIN_KEY:-}
    volumes:
      - transfers:/app/data
    ulimits:
      core: 0
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: none
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      backend:
        ipv4_address: 172.30.48.3

  proxy:
    image: nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    ulimits:
      core: 0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ${PASSING_NGINX_CONFIG:?Set PASSING_NGINX_CONFIG to your Nginx configuration file}
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - ${PASSING_CERTS_DIR:-./deploy/certs}:/etc/nginx/certs:ro
      - acme:/var/www/acme:ro
    logging:
      driver: none
    networks:
      frontend:
      backend:
        ipv4_address: 172.30.48.2
    depends_on: [web, api]

  certbot:
    image: certbot/certbot:latest@sha256:bc93cb710b413e6b456d622f9b0133b3e109c0a78c2ed9976af43d209b0a1805
    profiles: [tools]
    mem_limit: 256m
    pids_limit: 64
    ulimits:
      core: 0
    ports:
      - "80:80"
    volumes:
      - ${PASSING_CERTS_DIR:-./deploy/certs}:/etc/letsencrypt
      - acme:/var/www/acme
    logging:
      driver: none

volumes:
  transfers:
  acme:

networks:
  frontend:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.48.0/28
