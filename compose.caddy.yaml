name: passing-cloud-test

services:
  web:
    extends:
      file: compose.yaml
      service: web
    image: passing-cloud-test-web:${PASSING_RELEASE:-local}
    build:
      network: host

  api:
    extends:
      file: compose.yaml
      service: api
    image: passing-cloud-test-api:${PASSING_RELEASE:-local}
    build:
      network: host

  proxy:
    image: nginx:stable-alpine@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    ulimits:
      core: 0
    volumes:
      - type: bind
        source: ${PASSING_NGINX_CONFIG:?Set PASSING_NGINX_CONFIG to your Nginx configuration file}
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - /run/passing-cloud-test:/run/passing-cloud-test
    logging:
      driver: none
    networks:
      backend:
        ipv4_address: 172.30.48.2
    depends_on: [web, api]

volumes:
  transfers:

networks:
  backend:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-passing-test
    ipam:
      config:
        - subnet: 172.30.48.0/28
