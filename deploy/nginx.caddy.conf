user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/null crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 20s;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size 100065536;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    # Only the host proxy can use the socket directory.
    set_real_ip_from unix:;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_conn_zone $server_name zone=global_connections:1m;
    limit_req_zone $server_name zone=global_requests:1m rate=100r/s;
    limit_conn_status 429;
    limit_req_status 429;

    server {
        listen unix:/run/passing-cloud-test/proxy.sock default_server;
        server_name files.example.com;

        limit_conn global_connections 128;
        limit_req zone=global_requests burst=200 nodelay;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_http_version 1.1;
        proxy_set_header Host files.example.com;
        proxy_set_header X-Forwarded-Host files.example.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;

        location ~ (^|/)\. { return 404; }
        location /api/ { proxy_pass http://api:4000; }
        location / { proxy_pass http://web:3000; }
    }
}
